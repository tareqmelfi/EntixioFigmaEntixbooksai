name: QA Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    name: Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --reporter=list
        env:
          CI: 'true'
      - run: npm run qa:routes
        env:
          CI: 'true'
          QA_BROWSER: '1'
          QA_AUTO_START: '1'
          QA_ROUTE_SCOPE: 'solutions'

  protect:
    name: Protect Critical Files
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Verify critical files exist
        run: |
          for f in src/app/lib/api.ts src/app/lib/auth-client.ts src/app/lib/digits.ts src/app/components/side-panel.tsx src/app/components/app-sidebar.tsx src/app/routes.tsx; do
            [ -f "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          echo "All critical files present"