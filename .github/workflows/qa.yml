name: QA Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    name: Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:visual-contracts
      - run: npm run qa:visual-policy
      - run: npx playwright test --reporter=list
        env:
          CI: 'true'
      - run: npm run qa:routes
        env:
          CI: 'true'
          QA_BROWSER: '1'
          QA_AUTO_START: '1'
          QA_ROUTE_SCOPE: 'solutions'

  visual-regression-linux:
    name: Visual Regression (Linux)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npx playwright test tests/visual-regression.spec.ts --project=chromium --reporter=list
        env:
          CI: 'true'
          VISUAL_REGRESSION: '1'
      # On snapshot drift, publish the actual renders so an intentional visual
      # change can be accepted without a Linux workstation (review before
      # adopting — artifacts are the source of the new expected snapshots).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-linux-actual
          path: test-results/
          retention-days: 7

  visual-regression:
    name: Visual Regression (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test tests/visual-regression.spec.ts --project=chromium --reporter=list
        env:
          CI: 'true'
          VISUAL_REGRESSION: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-macos-actual
          path: test-results/
          retention-days: 7

  protect:
    name: Protect Critical Files
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Verify critical files exist
        run: |
          for f in src/app/lib/api.ts src/app/lib/auth-client.ts src/app/lib/digits.ts src/app/components/side-panel.tsx src/app/components/app-sidebar.tsx src/app/routes.tsx; do
            [ -f "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          echo "All critical files present"