name: Generate visual baselines for review
on:
  workflow_dispatch:
jobs:
  capture:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/visual-regression.spec.ts --project=chromium --update-snapshots --reporter=list
        env:
          CI: 'true'
          VISUAL_REGRESSION: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-candidates-${{ matrix.os }}
          path: tests/visual-regression.spec.ts-snapshots/
          retention-days: 7
